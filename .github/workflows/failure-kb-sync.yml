name: Failure KB — 2026 Sync

on:
  push:
    branches: [beta]
    paths:
      - website/data/failures/**
      - website/scripts/*failure*.mjs
      - website/src/components/FailureKB/**
      - website/docs/failures.mdx
      - website/package.json
      - .github/workflows/failure-kb-sync.yml
  schedule:
    # 08:17 JST. Keep off the top of the hour to reduce scheduled-run congestion.
    - cron: '17 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: failure-kb-2026-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Validate, discover, and measure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Refresh VRChat official raw corpus
        id: vrchat
        continue-on-error: true
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-vrchat-official-failures.mjs

      - name: Generate and validate current canonical corpus
        working-directory: website
        run: |
          npm run generate:current-failures
          npm run validate:ontology
          npm run validate:ja-display
          npm run validate:coverage

      - name: Check registered sources
        id: sources
        continue-on-error: true
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-failure-sources.mjs > failure-source-report.json

      - name: Discover GitHub failure candidates
        id: github_discovery
        continue-on-error: true
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-github-failures.mjs --json > github-failure-candidates.json

      - name: Discover note.com failure candidates
        id: note
        continue-on-error: true
        working-directory: website
        run: npm run discover:note-failures > note-discovery.log

      - name: Prepare note candidate queue
        id: note_queue
        if: always() && steps.note.outcome == 'success'
        working-directory: website
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('note-failure-candidates.json', 'utf8'));
          const candidates = report.candidates ?? [];
          const lines = [
            '## note.com Failure candidates',
            '',
            `Discovery status: **${report.status}**`,
            `Discovered at: ${report.discovered_at ?? 'unknown'}`,
            `Known Evidence URLs: ${report.known_evidence_urls ?? 0}`,
            `Sitemaps checked: ${report.sitemap_documents_checked ?? 0}`,
            `Article pages checked: ${report.article_pages_checked ?? 0}`,
            `Fetch/parse errors: ${(report.page_errors ?? []).length}`,
            '',
            'このIssueは日次collectorが更新する処理キューです。記事本文で確認できるFailureだけをraw record化し、Unity `2022.3.22f1`が観測環境として明示された場合だけcurrent canonicalへ昇格してください。',
            ''
          ];
          if (candidates.length) {
            lines.push('| published | title | URL |', '|---|---|---|');
            for (const item of candidates) {
              const title = (item.title ?? '(title unavailable)').replaceAll('|', '\\|');
              lines.push(`| ${item.published_at ?? ''} | ${title} | ${item.url} |`);
            }
          } else {
            lines.push('未処理のnote.com候補はありません。');
          }
          fs.writeFileSync('note-failure-candidates.md', `${lines.join('\n')}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${candidates.length}\nstatus=${report.status}\n`);
          NODE

      - name: Create or update note candidate Issue
        if: always() && steps.note_queue.outputs.count != '' && steps.note_queue.outputs.count != '0'
        working-directory: website
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_TITLE: "[auto] note.com Failure candidates"
        run: |
          issue_number="$(gh issue list --state open --search "$QUEUE_TITLE in:title" --json number,title --jq ".[] | select(.title == \"$QUEUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file note-failure-candidates.md
            echo "Updated candidate Issue #$issue_number"
          else
            gh issue create --title "$QUEUE_TITLE" --body-file note-failure-candidates.md
          fi

      - name: Close empty note candidate Issue
        if: always() && steps.note_queue.outputs.count == '0' && (steps.note_queue.outputs.status == 'success' || steps.note_queue.outputs.status == 'partial')
        working-directory: website
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_TITLE: "[auto] note.com Failure candidates"
        run: |
          issue_number="$(gh issue list --state open --search "$QUEUE_TITLE in:title" --json number,title --jq ".[] | select(.title == \"$QUEUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "日次探索で未処理候補が0件になったため自動closeします。"
          fi

      - name: Audit other web sources
        id: web
        continue-on-error: true
        working-directory: website
        run: node scripts/collect-web-failures.mjs --live > web-failure-source-report.json

      - name: Generate coverage report
        if: always()
        working-directory: website
        run: node scripts/failure-coverage.mjs --source-report failure-source-report.json > failure-coverage.json

      - name: Build docs
        working-directory: website
        run: npm run build

      - name: Upload audit and discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-kb-2026-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            website/data/failures/records-vrchat-official-2026.json
            website/failure-source-report.json
            website/github-failure-candidates.json
            website/note-failure-candidates.json
            website/note-failure-candidates.md
            website/note-discovery.log
            website/web-failure-source-report.json
            website/failure-coverage.json

      - name: Commit official source updates
        id: canonical_commit
        if: github.ref == 'refs/heads/beta' && steps.vrchat.outcome == 'success'
        run: |
          if git diff --quiet -- website/data/failures/records-vrchat-official-2026.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No canonical VRChat source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/failures/records-vrchat-official-2026.json
          git commit -m "chore(failure-kb): sync VRChat official 2026 records"
          git push origin HEAD:beta
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Re-deploy docs after official source update
        if: github.ref == 'refs/heads/beta' && steps.canonical_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs-deploy.yml --ref beta
