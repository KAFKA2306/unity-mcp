name: Docs — Build & Deploy

# Builds the Docusaurus site under /website and, on beta push or manual dispatch,
# deploys to GitHub Pages at https://kafka2306.github.io/unity-mcp/.
#
# PR runs only build (no deploy) as a preview-validation step.
# Re-deploys also fire when the Python tool/resource registry changes,
# so M3's auto-generated reference pages stay fresh.

on:
  push:
    branches: [beta]
    paths:
      - website/**
      - docs/**
      - Server/src/services/tools/**
      - Server/src/services/resources/**
      - Server/src/services/registry/**
      - .github/workflows/docs-deploy.yml
  pull_request:
    branches: [beta, main]
    paths:
      - website/**
      - docs/**
      - Server/src/services/tools/**
      - Server/src/services/resources/**
      - .github/workflows/docs-deploy.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Setup Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/beta') || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: website
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: npm run build

      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/beta') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/beta') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test published docs
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_ROOT: https://kafka2306.github.io/unity-mcp
    steps:
      - name: Fetch published pages and data
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 10 \
            "$SITE_ROOT/failures" -o /tmp/failures.html
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 10 \
            "$SITE_ROOT/unity-mcp-comparison" -o /tmp/unity-mcp-comparison.html
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 10 \
            "$SITE_ROOT/data/failures/current-2026.json" -o /tmp/current-2026.json
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 10 \
            "$SITE_ROOT/data/failures/migration-summary-2026.json" -o /tmp/migration-summary-2026.json

      - name: Validate published docs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          html = Path('/tmp/failures.html').read_text(encoding='utf-8')
          comparison_html = Path('/tmp/unity-mcp-comparison.html').read_text(encoding='utf-8')
          current = json.loads(Path('/tmp/current-2026.json').read_text(encoding='utf-8'))
          summary = json.loads(Path('/tmp/migration-summary-2026.json').read_text(encoding='utf-8'))

          assert '<html' in html.lower(), 'published /failures is not HTML'
          assert '<html' in comparison_html.lower(), 'published /unity-mcp-comparison is not HTML'
          assert 'Unity MCP' in comparison_html, 'published comparison page is missing its expected heading/content'
          assert isinstance(current, list), 'current-2026.json must be a JSON array'
          assert current, 'published current corpus must not be empty'

          raw_count = summary.get('raw_records')
          current_count = summary.get('current_canonical_records')
          excluded_count = summary.get('excluded_records')
          allowed_unity = set(summary.get('current_unity_versions') or [])

          assert isinstance(raw_count, int) and raw_count >= len(current), summary
          assert current_count == len(current), (summary, len(current))
          assert excluded_count == raw_count - current_count, summary
          assert allowed_unity, 'migration summary has no current Unity versions'
          assert all(record.get('environment', {}).get('unity_version') in allowed_unity for record in current), \
              'published current corpus contains a Unity version outside migration scope'

          print(
              f'Published docs smoke test passed: /failures and /unity-mcp-comparison HTTP OK; '
              f'raw {raw_count} / current {current_count} / excluded {excluded_count}; '
              f'Unity scope {sorted(allowed_unity)}.'
          )
          PY
